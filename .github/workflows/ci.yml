# CI for callsheet. Twenty fixed jobs (see docs/ci.md). The four required
# status check contexts on main are ci-linux, ci-macos, ci-linux-stress and
# ci-macos-stress. The main jobs and the sixteen stress workers (eight
# shards per platform: iteration 02c, plus the plane shard of iteration 05b,
# the sidecar shard of its sidecar follow-up, the plane and sidecar CPU1
# shards of iteration 06a-perf, which run each CPU 1 invocation alone on its
# own worker while CPU 2 and 4 stay concurrent on the plane and sidecar
# workers, and the packages-cpu shard of the stress worker rebalance, which
# runs the contract, mcpqual and workspace per-CPU groups apart from the
# combined packages invocation) are independent; the two stress summaries
# keep the required stress contexts and pass only if all eight of their
# platform's workers concluded success. All verification policy lives in ./cmd/devcheck; the
# contract is checked offline by internal/cicheck and tests/function. The
# Linux job's devcheck test also runs the M3/M4 container acceptance; its
# final always-run step publishes the retained evidence report to the log.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: ci-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
          check-latest: false
      - name: Download modules
        run: go mod download
      - name: devcheck test (native suite and race suite)
        run: go run ./cmd/devcheck test
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
      - name: devcheck coverage (> 80% gate)
        run: go run ./cmd/devcheck coverage
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
      - name: devcheck bench (byte and invariant limits)
        run: go run ./cmd/devcheck bench
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
      - name: devcheck cross (Linux/macOS build matrix)
        run: go run ./cmd/devcheck cross
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
      - name: Publish container E2E evidence
        if: always()
        run: cat /tmp/callsheet-container-e2e-evidence/report.txt

