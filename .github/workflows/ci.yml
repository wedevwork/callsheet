          cache: true
          cache-dependency-path: go.sum
          check-latest: false
      - name: Download modules
        run: go mod download
      - name: devcheck stress-functions
        run: go run ./cmd/devcheck stress-functions
        env:
          GOPROXY: "off"
          GOSUMDB: "off"

  macos-stress-packages:
    name: ci-macos-stress-packages
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
          check-latest: false
      - name: Download modules
        run: go mod download
      - name: devcheck stress-packages
        run: go run ./cmd/devcheck stress-packages
        env:
          GOPROXY: "off"
          GOSUMDB: "off"

  macos-stress-processgroup:
    name: ci-macos-stress-processgroup
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
          check-latest: false
      - name: Download modules
        run: go mod download
      - name: devcheck stress-processgroup
        run: go run ./cmd/devcheck stress-processgroup
